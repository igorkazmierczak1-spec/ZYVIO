openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VYBE 2.0 global social competition platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: battles
  - name: profile
  - name: leaderboard
  - name: notifications
  - name: ai
  - name: admin
  - name: reports
  - name: social
    description: Posts, comments, follows and social profiles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the personalized home dashboard
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /battles:
    get:
      operationId: listBattles
      tags: [battles]
      summary: List discoverable battles
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, live, completed]
      responses:
        "200":
          description: Battle list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Battle"
    post:
      operationId: createBattle
      tags: [battles]
      summary: Create a new battle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleInput"
      responses:
        "201":
          description: Created battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
  /battles/{battleId}:
    get:
      operationId: getBattle
      tags: [battles]
      summary: Get a battle
      parameters:
        - $ref: "#/components/parameters/BattleId"
      responses:
        "200":
          description: Battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
        "404":
          description: Battle not found
    post:
      operationId: joinBattle
      tags: [battles]
      summary: Join an open battle
      parameters:
        - $ref: "#/components/parameters/BattleId"
      responses:
        "200":
          description: Updated battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
  /battles/{battleId}/vote:
    post:
      operationId: voteBattle
      tags: [battles]
      summary: Vote for a battle participant
      parameters:
        - $ref: "#/components/parameters/BattleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "200":
          description: Updated battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the current profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get global or country leaderboard
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [global, country]
            default: global
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [weekly, monthly, all-time]
            default: weekly
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List current notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all current notifications as read
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /social/feed:
    get:
      operationId: getSocialFeed
      tags: [social]
      summary: Get the authenticated user's social feed
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [for-you, following, trending, latest]
            default: for-you
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Social feed page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialFeed" }
  /social/posts:
    post:
      operationId: createSocialPost
      tags: [social]
      summary: Create a social post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialPostInput" }
      responses:
        "201":
          description: Created social post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPost" }
  /social/posts/{postId}:
    get:
      operationId: getSocialPost
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Social post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPost" }
    patch:
      operationId: updateSocialPost
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialPostInput" }
      responses:
        "200":
          description: Updated social post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPost" }
    delete:
      operationId: deleteSocialPost
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Post removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /social/posts/{postId}/like:
    post:
      operationId: likeSocialPost
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated social post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPost" }
    delete:
      operationId: unlikeSocialPost
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated social post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPost" }
  /social/posts/{postId}/comments:
    get:
      operationId: listSocialComments
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Post comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialComment" }
    post:
      operationId: createSocialComment
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialCommentInput" }
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialComment" }
  /social/comments/{commentId}:
    delete:
      operationId: deleteSocialComment
      tags: [social]
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Comment removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /social/users/{profileId}:
    get:
      operationId: getSocialProfile
      tags: [social]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Social profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialProfile" }
  /social/users/{profileId}/follow:
    post:
      operationId: followSocialProfile
      tags: [social]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Follow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
    delete:
      operationId: unfollowSocialProfile
      tags: [social]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Follow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
  /social/users/{profileId}/block:
    post:
      operationId: blockSocialProfile
      tags: [social]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Block state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockState" }
    delete:
      operationId: unblockSocialProfile
      tags: [social]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Block state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockState" }
  /ai/ideas:
    post:
      operationId: generateIdeas
      tags: [ai]
      summary: Generate creative battle ideas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "200":
          description: Generated ideas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaResponse"
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a moderation report
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReport" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get owner dashboard metrics
      parameters:
        - $ref: "#/components/parameters/AdminRange"
      responses:
        "200":
          description: Owner dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Paginated users for administrators
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [USER, ADMIN] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, BLOCKED, DELETED] } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, lastActiveAt, xp, username] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: Users page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
    patch:
      operationId: updateAdminUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDeleteUserInput" }
      responses:
        "200":
          description: Deleted user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /admin/battles:
    get:
      operationId: listAdminBattles
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Battles page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBattlePage" }
  /admin/battles/{battleId}:
    patch:
      operationId: updateAdminBattle
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/BattleId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBattleUpdate" }
      responses:
        "200":
          description: Updated battle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBattle" }
  /admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
      responses:
        "200":
          description: Reports page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportPage" }
  /admin/reports/{reportId}:
    patch:
      operationId: updateAdminReport
      tags: [admin]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReportUpdate" }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReport" }
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Audit page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminRange"
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalytics" }
  /admin/notifications:
    get:
      operationId: listAdminNotifications
      tags: [admin]
      responses:
        "200":
          description: Admin notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminNotification" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
  /admin/monetization:
    get:
      operationId: getAdminMonetization
      tags: [admin]
      responses:
        "200":
          description: Monetization status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMonetization" }
  /premium/plans:
    get:
      operationId: listPremiumPlans
      tags: [premium]
      responses:
        "200":
          description: Premium prices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PremiumPlansResponse" }
  /premium/subscription:
    get:
      operationId: getPremiumSubscription
      tags: [premium]
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PremiumSubscriptionResponse" }
  /premium/checkout:
    post:
      operationId: createPremiumCheckout
      tags: [premium]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PremiumCheckoutInput" }
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
  /premium/portal:
    post:
      operationId: createPremiumPortal
      tags: [premium]
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
  /admin/billing/overview:
    get:
      operationId: getAdminBillingOverview
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/AdminRange" }]
      responses:
        "200":
          description: Billing overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingOverview" }
  /admin/billing/subscriptions:
    get:
      operationId: listAdminBillingSubscriptions
      tags: [admin]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Billing subscriptions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingSubscriptions" }
  /admin/billing/config:
    get:
      operationId: getAdminBillingConfig
      tags: [admin]
      responses:
        "200":
          description: Billing configuration status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBillingConfig" }
components:
  parameters:
    BattleId:
      name: battleId
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AdminRange:
      name: range
      in: query
      schema:
        type: string
        enum: [24h, 7d, 30d, 90d, all]
        default: 30d
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    SocialAuthor:
      type: object
      required: [id, username, displayName, avatarUrl]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        country: { type: string }
    SocialPost:
      type: object
      required: [id, author, body, category, createdAt, updatedAt, likeCount, commentCount, liked]
      properties:
        id: { type: string }
        author: { $ref: "#/components/schemas/SocialAuthor" }
        body: { type: string }
        mediaUrl: { type: string, nullable: true }
        mediaType: { type: string, nullable: true }
        category: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        likeCount: { type: integer }
        commentCount: { type: integer }
        liked: { type: boolean }
    SocialFeed:
      type: object
      required: [items, page, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SocialPost" }
        page: { type: integer }
        hasMore: { type: boolean }
    SocialPostInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        mediaUrl: { type: string, nullable: true }
        mediaType: { type: string, enum: [image, video], nullable: true }
        category: { type: string, default: General }
    SocialComment:
      type: object
      required: [id, body, createdAt, author]
      properties:
        id: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/SocialAuthor" }
    SocialCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 500 }
    SocialProfile:
      type: object
      required: [id, username, displayName, avatarUrl, bio, country, level, xp, rankingPoints, wins, losses, rank, league, streak, badges, winRate, followerCount, followingCount, isFollowing]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        country: { type: string }
        level: { type: integer }
        xp: { type: integer }
        rankingPoints: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        rank: { type: integer }
        league: { type: string }
        streak: { type: integer }
        badges:
          type: array
          items: { type: string }
        winRate: { type: integer }
        followerCount: { type: integer }
        followingCount: { type: integer }
        isFollowing: { type: boolean }
    FollowState:
      type: object
      required: [following]
      properties:
        following: { type: boolean }
    BlockState:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }
    UserSummary:
      type: object
      required: [id, username, displayName, country, avatarUrl, level, wins, losses, winRate, rankingPoints]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        country: { type: string }
        avatarUrl: { type: string }
        level: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: integer }
        rankingPoints: { type: integer }
    Profile:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
